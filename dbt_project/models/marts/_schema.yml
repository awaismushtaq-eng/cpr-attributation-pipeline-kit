version: 2

models:
  - name: fct_attributed_revenue
    description: Revenue enriched with first-touch and last-touch attribution.
    columns:
      - name: revenue_id
        tests: [unique, not_null]
      - name: user_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user_cohort')
                field: user_id
      - name: company_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_id
      - name: attr_channel_last_touch
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channel')
                field: channel_id
      - name: attr_channel_first_touch
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channel')
                field: channel_id
      - name: revenue_amount
        tests: [not_null]

  - name: fct_content_performance
    description: Content metrics by piece and month.
    columns:
      - name: content_id
        tests: [unique, not_null]
      - name: channel
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channel')
                field: channel_id

  - name: fct_campaign_roi
    description: Campaign spend vs attributed revenue under both models.
    columns:
      - name: campaign_id
        tests: [unique, not_null]
      - name: budget_usd
        tests: [not_null]

  - name: dim_channel
    columns:
      - name: channel_id
        tests: [unique, not_null]

  - name: dim_company
    columns:
      - name: company_id
        tests: [unique, not_null]

  - name: dim_user_cohort
    columns:
      - name: user_id
        tests: [unique, not_null]
      - name: cohort_key
        tests: [not_null]

  - name: dim_time
    columns:
      - name: date_day
        tests: [unique, not_null]
